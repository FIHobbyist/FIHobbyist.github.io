<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIHobbyist | Financial Calculators</title>
    <!-- 1. INCLUDE THE CHART.JS LIBRARY VIA CDN -->
    <script src="https://jsdelivr.net"></script>
    <style>
        :root { --primary: #2ecc71; --dark: #2c3e50; --light: #f8f9fa; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; color: var(--dark); line-height: 1.5; }
        h1 { text-align: center; color: var(--dark); border-bottom: 2px solid var(--light); padding-bottom: 10px; }
        .calc-container { background: #ffffff; border: 1px solid #e1e4e8; border-radius: 8px; padding: 25px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 25px; }
        .input-group { margin-bottom: 15px; }
        label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 14px; }
        input { width: 100%; padding: 10px; border: 1px solid #00000020; border-radius: 5px; font-size: 16px; box-sizing: border-box; }
        button { width: 100%; background: var(--primary); color: white; border: none; padding: 12px; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: opacity 0.2s; }
        button:hover { opacity: 0.9; }
        .results { margin-top: 25px; padding-top: 20px; border-top: 2px dashed var(--light); display: none; }
        .result-row { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 16px; }
        .highlight { font-weight: bold; color: var(--primary); font-size: 18px; }
        .chart-container { background: #ffffff; border: 1px solid #e1e4e8; border-radius: 8px; padding: 25px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); display: none; }
    </style>
</head>
<body>

    <h1>📊 FIHobbyist Calculator Lab</h1>
    
    <div class="calc-container">
        <h3 style="margin-top:0; color:var(--dark);">FI/RE Compound Interest Tool</h3>
        
        <div class="input-group">
            <label>Starting Principal ($)</label>
            <input type="number" id="principal" value="10000">
        </div>
        
        <div class="input-group">
            <label>Monthly Contribution ($)</label>
            <input type="number" id="monthly" value="500">
        </div>
        
        <div class="input-group">
            <label>Annual Interest Rate (%)</label>
            <input type="number" id="rate" value="8" step="0.1">
        </div>
        
        <div class="input-group">
            <label>Years to Grow</label>
            <input type="number" id="years" value="10">
        </div>
        
        <button onclick="calculateCompound()">Calculate My Growth</button>
        
        <div class="results" id="outputBox">
            <div class="result-row">
                <span>Total Contributions:</span>
                <span id="totalSaved" style="font-weight:600;">$0.00</span>
            </div>
            <div class="result-row">
                <span>Total Interest Earned:</span>
                <span id="totalInterest" style="font-weight:600; color: #3498db;">$0.00</span>
            </div>
            <div class="result-row" style="margin-top: 15px; padding-top: 10px; border-top: 1px solid var(--light);">
                <span>Ultimate Portfolio Value:</span>
                <span id="totalWealth" class="highlight">$0.00</span>
            </div>
        </div>
    </div>

    <!-- 2. PLACE THE CANVAS ELEMENT WHERE THE CHART WILL RENDER -->
    <div class="chart-container" id="chartBox">
        <canvas id="growthChart"></canvas>
    </div>

    <script>
        // Global variable to hold chart instance so we can clear/rebuild it cleanly
        let myChartInstance = null;

        function calculateCompound() {
            const p = parseFloat(document.getElementById('principal').value) || 0;
            const pm = parseFloat(document.getElementById('monthly').value) || 0;
            const r = (parseFloat(document.getElementById('rate').value) || 0) / 100 / 12;
            const yearsMax = parseInt(document.getElementById('years').value) || 0;
            const totalMonths = yearsMax * 12;
            
            let total = p;
            let principalContributed = p;
            
            // 3. ARRAYS TO COLLECT DATA POINT TRACKS FOR EACH YEAR
            let chartLabels = [];
            let chartDataPrincipal = [];
            let chartDataTotal = [];
            
            // Capture Year 0 initial state
            chartLabels.push("Year 0");
            chartDataPrincipal.push(p);
            chartDataTotal.push(p);

            for (let month = 1; month <= totalMonths; month++) {
                total = (total + pm) * (1 + r);
                principalContributed += pm;
                
                // Track data points strictly at the end of every 12-month sequence
                if (month % 12 === 0) {
                    const currentYear = month / 12;
                    chartLabels.push("Year " + currentYear);
                    chartDataPrincipal.push(Math.round(principalContributed));
                    chartDataTotal.push(Math.round(total));
                }
            }
            
            const interestEarned = total - principalContributed;
            const formatter = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' });
            
            document.getElementById('totalSaved').innerText = formatter.format(principalContributed);
            document.getElementById('totalInterest').innerText = formatter.format(interestEarned);
            document.getElementById('totalWealth').innerText = formatter.format(total);
            document.getElementById('outputBox').style.display = 'block';
            document.getElementById('chartBox').style.display = 'block';

            // 4. GENERATE OR DESTROY/REBUILD THE LIVE CHART
            if (myChartInstance) {
                myChartInstance.destroy();
            }

            const ctx = document.getElementById('growthChart').getContext('2d');
            myChartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: chartLabels,
                    datasets: [
                        {
                            label: 'Your Contributions',
                            data: chartDataPrincipal,
                            backgroundColor: '#2c3e50'
                        },
                        {
                            label: 'Total Value (with Interest)',
                            data: chartDataTotal,
                            backgroundColor: '#2ecc71'
                        }
                    ]
                },
                options: {
                    responsive: true,
                    scales: {
                        y: { beginAtZero: true }
                    }
                }
            });
        }
    </script>
</body>
</html>
